[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-mcp-gateway"
version = "0.18.0"
description = "Standalone local MCP gateway with portable company profiles"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.30.0",
  "anyio>=4.8,<5",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "starlette>=0.40,<2",
  "uvicorn>=0.32,<1",
  "filelock>=3.16,<5",
  "jsonschema>=4.20,<5",
  "referencing>=0.30,<1",
]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
test = ["pytest>=8,<10"]

[project.scripts]
ag-mcp-gateway = "gateway.cli:main"

[tool.setuptools]
packages = ["gateway"]

[tool.setuptools.package-data]
gateway = ["assets/*.js", "assets/mock-test-workspace.css", "assets/ag-rail/*", "assets/ag-controls/*"]
